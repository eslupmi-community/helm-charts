name: release

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        env:
          OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/helm-charts
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if (( ${#packages[@]} == 0 )); then
            echo "No new chart packages were released; skipping OCI push."
            exit 0
          fi
          for tgz in "${packages[@]}"; do
            echo "Pushing ${tgz} to ${OCI_REGISTRY}"
            helm push "$tgz" "$OCI_REGISTRY"
          done
