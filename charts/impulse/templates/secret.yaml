{{- if include "impulse.hasInlineSecrets" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "impulse.fullname" . }}-secrets
  labels:
    {{- include "impulse.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $root := . }}
  {{- $type := $root.Values.impulseConfig.messenger.type }}
  {{- $bindings := include "impulse.messengerSecretBindings" . | fromYaml }}
  {{- $cfg := index $bindings $type }}
  {{- if $cfg }}
  {{- $inline := index ($root.Values.secrets.inline | default dict) $type | default dict }}
  {{- if index $inline $cfg.inlineGateField }}
  {{- range $cfg.vars }}
  {{ .inlineSecretKey }}: {{ index $inline .inlineValueField | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- $integrations := include "impulse.integrationSecretBindings" . | fromYaml }}
  {{- range $integration, $icfg := $integrations }}
  {{- $inline := get ($root.Values.secrets.inline | default dict) $integration | default dict }}
  {{- if index $inline $icfg.inlineGateField }}
  {{- range $icfg.vars }}
  {{ .inlineSecretKey }}: {{ index $inline .inlineValueField | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if include "impulse.inlineGoogleSecret" $root }}
  google-service-account-key: {{ include "impulse.inlineGoogleSecret" $root | b64enc | quote }}
  {{- end }}
{{- end }}
