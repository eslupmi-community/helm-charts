{{- if .Values.ingress.enabled -}}
{{- $fullName := include "impulse.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $ingressAnnotations := .Values.ingress.annotations | default dict | deepCopy -}}
{{- if and .Values.ingress.className (not (hasKey $ingressAnnotations "kubernetes.io/ingress.class")) }}
  {{- $_ := set $ingressAnnotations "kubernetes.io/ingress.class" .Values.ingress.className }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "impulse.labels" . | nindent 4 }}
  {{- with $ingressAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ if $.Values.ingress.httpPrefix }}{{ $.Values.ingress.httpPrefix }}{{ .path }}{{ else }}{{ .path }}{{ end }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
