apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "impulse.fullname" . }}
  labels:
    {{- include "impulse.labels" . | nindent 4 }}
spec:
  {{- if not (eq (include "impulse.autoscalingEnabled" . | trim) "true") }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    type: {{ .type }}
    {{- if and (eq .type "RollingUpdate") .rollingUpdate }}
    rollingUpdate:
      {{- toYaml .rollingUpdate | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "impulse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Force pod recreation when configmap or secrets change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if include "impulse.hasInlineSecrets" . }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "impulse.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "impulse.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "impulse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $reservedEnv := dict -}}
            {{- range include "impulse.reservedEnvNames" . | splitList "\n" }}
            {{- if . }}
            {{- $_ := set $reservedEnv . true -}}
            {{- end }}
            {{- end }}
            {{- range $key := .Values.env | keys | sortAlpha }}
            {{- if not (hasKey $reservedEnv $key) }}
            - name: {{ $key }}
              value: {{ index $.Values.env $key | quote }}
            {{- end }}
            {{- end }}
            - name: LISTEN_HOST
              value: {{ (.Values.env.LISTEN_HOST | default "0.0.0.0") | quote }}
            - name: LISTEN_PORT
              value: {{ .Values.service.port | quote }}
            {{- include "impulse.messengerSecretEnv" . | nindent 12 }}
            {{- include "impulse.integrationSecretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.env.DATA_PATH }}
            - name: config
              mountPath: {{ .Values.env.CONFIG_PATH }}
            {{- range $filename, $spec := include "impulse.customTemplates" . | fromYaml }}
            - name: config
              mountPath: {{ $spec.mountPath }}
              subPath: {{ $filename }}
              readOnly: true
            {{- end }}
            {{- if include "impulse.googleServiceAccountEnabled" . }}
            - name: google-service-account
              mountPath: {{ .Values.env.GOOGLE_SERVICE_ACCOUNT_FILE }}
              subPath: key.json
              readOnly: true
            {{- end }}

            {{- range .Values.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.name | default (printf "%s-data" (include "impulse.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "impulse.fullname" . }}-config

        {{- if include "impulse.googleServiceAccountEnabled" . }}
        {{- $googleExisting := get (.Values.secrets.existing | default dict) "google" | default dict }}
        - name: google-service-account
          secret:
            {{- if $googleExisting.secretName }}
            secretName: {{ $googleExisting.secretName }}
            items:
              - key: {{ $googleExisting.serviceAccountKeyKey }}
                path: key.json
            {{- else }}
            secretName: {{ include "impulse.fullname" . }}-secrets
            items:
              - key: google-service-account-key
                path: key.json
            {{- end }}
        {{- end }}
        {{- range .Values.volumes }}
        - name: {{ .name }}
          {{- if .configMap }}
          configMap:
            name: {{ .configMap.name }}
            {{- if .configMap.items }}
            items:
              {{- toYaml .configMap.items | nindent 14 }}
            {{- end }}
          {{- else if .secret }}
          secret:
            secretName: {{ .secret.secretName }}
            {{- if .secret.items }}
            items:
              {{- toYaml .secret.items | nindent 14 }}
            {{- end }}
          {{- else if .persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ .persistentVolumeClaim.claimName }}
          {{- else if .emptyDir }}
          emptyDir:
            {{- toYaml .emptyDir | nindent 12 }}
          {{- end }}
        {{- end }}
