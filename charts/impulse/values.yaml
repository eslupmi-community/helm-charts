# Default values for impulse
# This is a YAML-formatted file.

# Should not be changed until IMPulse supports multiple replicas.
# Ignored when autoscaling.enabled is true (HPA controls replica count).
# replicaCount: 1

# Deployment strategy
# Use "Recreate" to kill all existing pods before creating new ones
# Use "RollingUpdate" for zero-downtime deployments (default)
strategy:
  type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

image:
  repository: ghcr.io/eslupmi/impulse
  pullPolicy: IfNotPresent
  tag: ""  # If empty, will use .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Custom labels to add to all resources
labels: {}
  # environment: production
  # team: platform
  # cost-center: infra

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  # Application listen port (container, Service target, and probes use this via named port "http")
  port: 5000

serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  labels: {}
  relabelings: []
  metricRelabelings: []
  namespaceSelector: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: impulse.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: impulse-tls
  #    hosts:
  #      - impulse.local
  
  # HTTP prefix configuration for reverse proxy deployments
  httpPrefix: ""  # "/impulse" for example

resources:
  limits:
    memory: 256Mi
  requests: 
    cpu: 100m
    memory: 128Mi

# Should not be changed until Impulse supports multiple replicas.
# When enabled, replica count is controlled by the HPA (replicaCount is ignored).
# autoscaling:
#   enabled: false
#   minReplicas: 1
#   maxReplicas: 100
#   targetCPUUtilizationPercentage: 80
#   targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  name: ""  # Custom PVC name (if empty, uses default naming)

# Container environment variables (literal values).
# See https://impulse.bot/docs/stable/envs/
# LISTEN_HOST / LISTEN_PORT are set by the chart (LISTEN_PORT = service.port).
# Use envFrom or secrets.* for sensitive values (messengers, AUTH_CLIENT_SECRET, JIRA_API_TOKEN).
env:
  DATA_PATH: "/data"
  CONFIG_PATH: "/config"
  LOG_LEVEL: "INFO"
  LISTEN_HOST: "0.0.0.0"

  CHAIN_PROVIDER_SYNC_INTERVAL_SECONDS: "60"
  CHAIN_PROVIDER_MAX_EVENTS: "10"
  CHAIN_PROVIDER_DAYS_TO_SYNC: "7"

  CORS_ALLOWED_ORIGINS: "http://localhost:5000"
  HTTP_PREFIX: ""

  GOOGLE_SERVICE_ACCOUNT_FILE: "/config/key.json"

  # OAuth authentication (https://impulse.bot/docs/stable/guides/authentication/)
  # AUTH_CLIENT_ID: ""
  # AUTH_REDIRECT_URL: ""
  # AUTH_CLIENT_SECRET: use secrets.inline.auth or secrets.existing.auth

  # Jira task management (https://impulse.bot/docs/stable/integrations/task_management/jira/)
  # JIRA_BASE_URL: ""
  # JIRA_USER_EMAIL: ""
  # JIRA_API_TOKEN: use secrets.inline.jira or secrets.existing.jira

  # Outbound proxy
  # HTTP_PROXY: ""
  # HTTPS_PROXY: ""
  # NO_PROXY: ""

envFrom: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret
  #     optional: true

# impulse.yml content — https://impulse.bot/docs/stable/config_file/
impulseConfig:
  general:
    timezone: UTC
    week_start: Mon
    workday_start: "09:00"

  incident:
    notifications:
      assignment: true
      freeze: false
      new_firing: true
      partial_resolved: true
      status_update: true
    timeouts:
      firing: "6h"
      unknown: "6h"
      resolved: "12h"
      closed: "90d"

  inhibit_rules: []

  messenger:
    type: "slack"  # slack, mattermost, telegram, none
    # Mattermost: address, team, impulse_address
    # Telegram: impulse_address
    admin_users: []
    users: {}
    user_groups: {}
    groups: {}
    channels: {}
    chains: {}

  route:
    channel: ""
    # chain: ""
    routes: []

  # task_management:
  #   type: jira
  #   project_key: PROJ

  ui:
    columns: []
    sorting: []
    colors: {}
    filters: []

  webhooks: {}

# Optional Jinja templates overlaid onto IMPulse default paths.
# Incident and task files: /app/templates/<type>_<name>.j2
# Thread files: /app/thread_templates/<messenger.type>_<name>.j2
# Do not set messenger.template_files or task_management.template_files
# (removed in this chart; IMPulse drops optional paths in v4.0.0).
# https://impulse.bot/docs/stable/concepts/templates/
templates:
  # Incident messages → ./templates/<messenger.type>_{header,body,status_icons}.j2
  header: ""
  body: ""
  status_icons: ""

  # Task management → ./templates/<task_management.type>_{summary,description}.j2
  summary: ""
  description: ""
  # Deprecated aliases (still accepted): jiraSummary, jiraDescription

  # Thread messages → ./thread_templates/<messenger.type>_<name>.j2
  thread:
    chain_step_group: ""
    chain_step_user: ""
    chain_step_user_group: ""
    chain_step_webhook: ""
    incident_notifications_assignment: ""
    incident_notifications_freeze: ""
    incident_notifications_new_firing: ""
    incident_notifications_partial_resolved: ""
    incident_notifications_status_update: ""
    incident_notifications_unfreeze: ""

# Secret management
secrets:
  # Option 1: Reference existing secrets (recommended for production)
  # Uncomment and configure when using existing secrets
  # existing:
  #   slack:
  #     secretName: "my-slack-secrets"  # Name of existing secret containing both tokens
  #     botUserOauthTokenKey: "slack-bot-user-oauth-token"
  #     verificationTokenKey: "slack-verification-token"
  #   mattermost:
  #     secretName: "my-mattermost-secrets"  # Name of existing secret
  #     accessTokenKey: "mattermost-access-token"
  #   telegram:
  #     secretName: "my-telegram-secrets"  # Name of existing secret
  #     botTokenKey: "telegram-bot-token"
  #   google:
  #     secretName: "my-google-secrets"
  #     serviceAccountKeyKey: "google-service-account-key"
  #   auth:
  #     secretName: "my-auth-secrets"
  #     clientSecretKey: "auth-client-secret"
  #   jira:
  #     secretName: "my-jira-secrets"
  #     apiTokenKey: "jira-api-token"

  # Option 2: Inline secrets (for development/testing)
  inline:
    slack:
      botUserOauthToken: ""
      verificationToken: ""
    mattermost:
      accessToken: ""
    telegram:
      botToken: ""
    google:
      serviceAccountKey: ""
    auth:
      clientSecret: ""
    jira:
      apiToken: ""

# Additional volumes and mounts
volumes: []
volumeMounts: []

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network policy
networkPolicy:
  enabled: false
  ingressRules: []
  egressRules: []
